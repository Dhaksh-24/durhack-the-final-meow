<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: sticky header with Tasks / Notes tabs; one column of cards: setup steps, task composer, filters, task tree. Notes tab: composer + note cards. */
  --bg: #f3f5f1;
  --surface: #ffffff;
  --ink: #17211b;
  --muted: #5d6b61;
  --line: #d9e1d8;
  --accent: #1f6b45;
  --accent-ink: #ffffff;
  --accent-soft: #e1eee5;
  --doing: #a65f00;
  --doing-soft: #fbeed6;
  --done: #7f8b83;
  --place: #275b86;
  --place-soft: #e2ecf5;
  --note: #fff8dc;
  --note-line: #eadf9f;
  --danger: #b3261e;
  --danger-soft: #fbe6e4;
  --shadow: 0 1px 2px rgba(20, 40, 28, .06), 0 6px 20px rgba(20, 40, 28, .06);
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --surface: #171f1a; --ink: #e5ebe6; --muted: #98a59c; --line: #2a352e;
    --accent: #5cbf89; --accent-ink: #0b1810; --accent-soft: #1b3125;
    --doing: #f0a943; --doing-soft: #36290f; --done: #6c7970;
    --place: #86b9e4; --place-soft: #1a2835; --note: #2a2715; --note-line: #4a4422;
    --danger: #ff8a7f; --danger-soft: #3a1c19;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --surface: #171f1a; --ink: #e5ebe6; --muted: #98a59c; --line: #2a352e;
  --accent: #5cbf89; --accent-ink: #0b1810; --accent-soft: #1b3125;
  --doing: #f0a943; --doing-soft: #36290f; --done: #6c7970;
  --place: #86b9e4; --place-soft: #1a2835; --note: #2a2715; --note-line: #4a4422;
  --danger: #ff8a7f; --danger-soft: #3a1c19;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .6; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 0 0; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.logo { width: 30px; height: 30px; flex: none; }
.me { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.me select { max-width: 160px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.conn { font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.conn.live { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.conn.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.conn.warn { color: var(--doing); }
.conn.error { color: var(--danger); }
.tabs { display: flex; gap: 4px; width: 100%; margin-top: 4px; }
.tabs button {
  border: 0; background: transparent; padding: 10px 14px 11px; font-weight: 600; font-size: 15px; color: var(--muted);
  border-bottom: 3px solid transparent; display: inline-flex; gap: 8px; align-items: center;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .badge { font-family: var(--font-mono); font-size: 11px; background: var(--line); color: var(--ink); border-radius: 999px; padding: 1px 7px; font-weight: 500; }
.tabs button[aria-selected="true"] .badge { background: var(--accent); color: var(--accent-ink); }

main { padding: 18px 0 90px; display: grid; gap: 16px; }
.panel { display: grid; gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card h2 { font-family: var(--font-display); font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
.card p.lead { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

.notice { padding: 10px 14px; border-radius: 10px; font-size: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.notice.info { background: var(--accent-soft); }
.notice.warn { background: var(--doing-soft); }
.notice.error { background: var(--danger-soft); }
.notice .grow { flex: 1 1 240px; }

/* Setup */
.steps { display: grid; gap: 14px; margin-top: 8px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.step .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.step.ok .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step .what { font-weight: 600; margin-bottom: 6px; padding-top: 3px; }
.step.later { opacity: .55; }

/* People */
.team { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.team .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; font-weight: 600; }
.person {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 4px 3px 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-size: 13px; font-weight: 500;
}
.person.no-x { padding-right: 10px; }
.person .x { border: 0; background: none; color: var(--muted); padding: 0 6px; font-size: 16px; line-height: 1; border-radius: 999px; }
.person .x:hover { color: var(--danger); }
.av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; }
.add-person { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.add-person input { width: 170px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.whoami { display: flex; flex-wrap: wrap; gap: 8px; }
.whoami button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.whoami button:hover { border-color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 500; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }

/* Composer */
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 0; }
.composer:focus-within { border-color: var(--accent); }
.composer .under { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 6px 10px 0; }
.composer .under b { color: var(--ink); font-weight: 600; }
.composer .under button { border: 0; background: var(--bg); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
.composer .title-row { display: flex; gap: 8px; align-items: center; }
.composer .title-row input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px; font-size: 17px; }
.composer .title-row input:focus { outline: none; }
.composer .more { display: grid; gap: 12px; padding: 6px 10px 10px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 12px; }
.mini-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.where-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.where-row input { flex: 1 1 200px; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.place-chip { border: 1px solid transparent; background: var(--place-soft); color: var(--place); border-radius: 6px; padding: 3px 8px; font-family: var(--font-mono); font-size: 12px; }
.place-chip[aria-pressed="true"] { border-color: var(--place); }
.composer textarea { width: 100%; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); min-height: 60px; resize: vertical; }
.composer .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkish { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 0; }

.pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pick button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px 4px 4px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.pick button .av { width: 20px; height: 20px; font-size: 10px; }
.pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.pick button[aria-pressed="true"]::after { content: "✓"; color: var(--accent); font-weight: 700; margin-left: 2px; }
.pick .newp { width: 150px; padding: 4px 11px; border-radius: 999px; border: 1px dashed var(--line); background: transparent; font-size: 13px; }

/* Summary */
.summary { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; font-size: 14px; color: var(--muted); }
.summary b { font-family: var(--font-display); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px; }
.summary .doing b { color: var(--doing); }
.summary .mine b { color: var(--accent); }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; width: 100%; }
.bar span { display: block; height: 100%; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.filters select { padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }

/* Tree */
.list { display: grid; gap: 8px; }
.group-h { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 12px 0 2px; display: flex; align-items: center; gap: 8px; }
.group-h .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 500; }
.node { display: grid; gap: 6px; }
.children { margin-left: 17px; padding-left: 14px; border-left: 2px solid var(--line); display: grid; gap: 6px; }
.row {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  position: relative;
}
.children > .node > .row::before { content: ""; position: absolute; left: -16px; top: 24px; width: 14px; border-top: 2px solid var(--line); }
.row.doing { border-left: 4px solid var(--doing); padding-left: 9px; }
.row.done .title { text-decoration: line-through; color: var(--done); }
.row.context { opacity: .55; }
.tick {
  width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; padding: 0;
}
.tick:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.tick svg { width: 16px; height: 16px; }
.row.done .tick { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.title { font-weight: 600; overflow-wrap: anywhere; padding-top: 3px; }
.crumb { font-size: 12px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px 2px 2px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.chip .av { width: 18px; height: 18px; font-size: 10px; }
.chip.me { border-color: var(--accent); }
.chip.none { padding: 2px 8px; color: var(--muted); border-style: dashed; }
.place { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--place-soft); color: var(--place); }
.place svg { width: 12px; height: 12px; }
.state-pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--doing); background: var(--doing-soft); padding: 2px 8px; border-radius: 999px; }
.tnotes { font-size: 13px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.act { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 10px; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.act:hover { color: var(--ink); border-color: var(--muted); }
.act svg { width: 14px; height: 14px; }
.act.claim { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.act.claim:hover { background: var(--accent-soft); }
.act.start { border-color: var(--doing); color: var(--doing); font-weight: 600; }
.act.start:hover { background: var(--doing-soft); }
.act.del:hover { color: var(--danger); border-color: var(--danger); }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); border: 2px dashed var(--line); border-radius: 14px; }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }

/* Notes */
.note-composer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; display: grid; gap: 8px; }
.note-composer:focus-within { border-color: var(--accent); }
.note-composer textarea { width: 100%; border: 0; background: transparent; padding: 6px; font-size: 16px; min-height: 70px; resize: vertical; }
.note-composer textarea:focus { outline: none; }
.note-composer .foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
.note { background: var(--note); border: 1px solid var(--note-line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.note.pinned { box-shadow: inset 0 3px 0 var(--doing); }
.note .text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.note .text a { color: var(--place); }
.note .by { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.note .by .av { width: 18px; height: 18px; font-size: 10px; }
.note .tools { display: flex; gap: 6px; flex-wrap: wrap; }
.note textarea { width: 100%; min-height: 100px; padding: 8px; border-radius: 8px; border: 1px solid var(--note-line); background: var(--surface); resize: vertical; }
.pin-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--doing); }

/* Start screen */
.start { max-width: 520px; margin: 24px auto 0; display: grid; gap: 14px; }
.start .card { display: grid; gap: 10px; }
.start .or { text-align: center; color: var(--muted); font-size: 13px; }
.join-row { display: flex; gap: 8px; flex-wrap: wrap; }
.join-row input, .copy-row input { flex: 1 1 220px; min-width: 0; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
.copy-row { display: flex; gap: 8px; flex-wrap: wrap; }
.copy-row input { font-family: var(--font-mono); font-size: 13px; }
.setup-steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.setup-steps code { font-family: var(--font-mono); font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }

pre.rules { margin: 6px 0 0; max-height: 180px; overflow: auto; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre; }
.setup-steps li { padding-left: 2px; }
.setup-steps a { color: var(--place); }
.setup-steps textarea { width: 100%; min-height: 110px; margin-top: 6px; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-family: var(--font-mono); font-size: 12px; resize: vertical; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }

/* Sheet */
.overlay { position: fixed; inset: 0; background: rgba(10, 20, 14, .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--surface); border-radius: 16px; width: min(560px, 100%); max-height: calc(100% - 16px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet form, .sheet .confirm { padding: 20px; display: grid; gap: 14px; }
.sheet h2 { font-family: var(--font-display); font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.field { display: grid; gap: 6px; }
.field > label, .field > .flabel { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.field input[type="text"], .field select, .field textarea { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
.field textarea { min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.err { color: var(--danger); font-size: 13px; }
.err:empty { display: none; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 12px 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 4px 6px; filter: brightness(1.4); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 560px) {
  .two { grid-template-columns: 1fr; }
  .brand h1 { font-size: 22px; }
  .act .lbl-long { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .row, .note { transition: border-color .15s, opacity .15s; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="6" r="4" fill="var(--accent)"/>
        <path d="M16 10v8M16 18H8v4M16 18h8v4M16 18v4" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="8" cy="26" r="3.2" fill="var(--doing)"/>
        <circle cx="16" cy="26" r="3.2" fill="var(--place)"/>
        <circle cx="24" cy="26" r="3.2" fill="var(--accent)"/>
      </svg>
      <div>
        <h1>Task Tree</h1>
        <div class="sub">team board · DurHack</div>
      </div>
    </div>
    <div class="me">
      <label for="me-select">I'm</label>
      <select id="me-select"></select>
    </div>
    <button type="button" class="btn small" id="invite-btn" hidden>Invite friends</button>
    <span id="conn" class="conn">connecting…</span>

</header>

<div class="wrap">

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ============================================================
   Optional. You don't need to edit this file: the app walks you
   through connecting Firebase the first time you open it, and the
   invite link carries the connection to your friends.
   If you'd rather hard-code it, paste your Firebase web config here.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "000000000000",
  appId: "PASTE_YOUR_APP_ID"
};
const FIREBASE_VERSION = "12.19.0";
/* ============================================================ */

(function () {
  "use strict";

  // ---------- helpers ----------
  const $ = (s) => document.querySelector(s);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function svg(path) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = path; return s;
  }
  const ICON = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
    pin: '<path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/>',
    sub: '<path d="M6 4v9a3 3 0 003 3h9M14 12l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    play: '<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
    pause: '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>',
    hand: '<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'
  };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function newId() { return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); }
  const norm = (s) => String(s || "").trim().replace(/\s+/g, " ");
  const keyOf = (s) => norm(s).toLowerCase();
  const PALETTE = ["#1f6b45", "#a65f00", "#275b86", "#8a3b78", "#b3401e", "#3b6e6e", "#5b5bb0", "#6b6b1f"];
  function colorFor(name) { let x = 0; for (const c of keyOf(name)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[x % PALETTE.length]; }
  function initials(name) { const p = norm(name).split(" ").filter(Boolean); return ((p[0] || "?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
  function avatar(name) { return h("span", { class: "av", style: "background:" + colorFor(name), "aria-hidden": "true" }, initials(name)); }
  function ago(ms) {
    if (!ms) return "";
    const s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return new Date(ms).toLocaleDateString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  }
  function linkify(text) {
    const frag = document.createDocumentFragment();
    const re = /(https?:\/\/[^\s<>"]+)/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) frag.append(text.slice(last, m.index));
      const url = m[1].replace(/[.,;:!?)]+$/, "");
      frag.append(h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, url));
      last = m.index + url.length; re.lastIndex = last;
    }
    if (last < text.length) frag.append(text.slice(last));
    return frag;
  }

  // ---------- state ----------
  const LS_ME = "tasktree.me", LS_VIEW = "tasktree.view";
  const state = {
    tasks: new Map(), team: new Map(), notes: new Map(),
    me: lsGet(LS_ME) || "",
    view: lsGet(LS_VIEW) || "tree",
    tab: location.hash === "#notes" ? "notes" : "tasks",
    onlyMine: false, fPlace: "", hideDone: false,
    canWrite: true, db: null, loaded: false, board: "",
    editingNote: null
  };
  const STATUS_LABEL = { todo: "To do", doing: "In progress", done: "Done" };
  const STATUS_RANK = { doing: 0, todo: 1, done: 2 };

  // composer state survives re-renders
  const draft = { title: "", picked: [], location: "", notes: "", parent: "", open: false, showNotes: false };

  // ---------- toast ----------
  let toastTimer;
  function toast(msg, action) {
    const t = $("#toast");
    t.replaceChildren(h("span", null, msg)); if (action) t.append(h("button", { type: "button", onclick: () => { t.hidden = true; action.run(); } }, action.label));
    t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), action ? 6000 : 3500);
  }

  // ---------- store (shared db, or in-memory fallback) ----------
  function handleWriteError(e) {
    const code = String((e && e.code) || "").replace(/^firestore\//, "");
    if (code === "permission-denied") toast("The database refused that change. Check the Firestore rules were published (setup step 3).");
    else if (code === "resource-exhausted") toast("The free database limit was hit for today. Changes will work again tomorrow.");
    else toast("Couldn't save that. Check your connection and try again.");
  }
  async function retrying(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && String(e.code).endsWith("unavailable")) { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }
  function coll(name) {
    return {
      async set(id, data) {
        if (!state.db) { state[name].set(id, data); render(); return; }
        try { await retrying(() => state.db.set(name, id, data)); } catch (e) { handleWriteError(e); throw e; }
      },
      async patch(id, patch) {
        if (!state.db) { state[name].set(id, Object.assign({}, state[name].get(id), patch)); render(); return; }
        try { await retrying(() => state.db.update(name, id, patch)); } catch (e) { handleWriteError(e); throw e; }
      },
      async del(id) {
        if (!state.db) { state[name].delete(id); render(); return; }
        try { await retrying(() => state.db.del(name, id)); } catch (e) { handleWriteError(e); throw e; }
      }
    };
  }
  const T = coll("tasks"), TEAM = coll("team"), N = coll("notes");
  const quiet = () => {};

  // ---------- derived ----------
  function teamNames() {
    const out = [...state.team.values()].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map((m) => norm(m.name)).filter(Boolean);
    const seen = new Set(out.map(keyOf));
    for (const t of state.tasks.values()) for (const a of t.assignees || []) if (!seen.has(keyOf(a))) { seen.add(keyOf(a)); out.push(norm(a)); }
    return out;
  }
  function places() {
    const m = new Map();
    const sorted = [...state.tasks.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    for (const t of sorted) { const p = norm(t.location); if (p && !m.has(keyOf(p))) m.set(keyOf(p), p); }
    return [...m.values()];
  }
  function childrenMap() {
    const m = new Map();
    for (const [id, t] of state.tasks) {
      const p = t.parent && state.tasks.has(t.parent) && t.parent !== id ? t.parent : "";
      if (!m.has(p)) m.set(p, []);
      m.get(p).push(id);
    }
    return m;
  }
  function descendants(id, cm) {
    const out = new Set(); const stack = [id];
    while (stack.length) { const c = stack.pop(); for (const k of cm.get(c) || []) if (!out.has(k)) { out.add(k); stack.push(k); } }
    return out;
  }
  function cmp(a, b) {
    const A = state.tasks.get(a), B = state.tasks.get(b);
    return (STATUS_RANK[A.status] ?? 1) - (STATUS_RANK[B.status] ?? 1) || (A.createdAt || 0) - (B.createdAt || 0);
  }
  const isMine = (t) => !!state.me && (t.assignees || []).map(keyOf).includes(keyOf(state.me));
  function matches(t) {
    if (state.hideDone && t.status === "done") return false;
    if (state.onlyMine && !isMine(t)) return false;
    const p = keyOf(t.location);
    if (state.fPlace === "__none") { if (p) return false; }
    else if (state.fPlace && p !== keyOf(state.fPlace)) return false;
    return true;
  }
  function addMemberIfNew(name) {
    const known = new Set([...state.team.values()].map((m) => keyOf(m.name)));
    if (known.has(keyOf(name))) return Promise.resolve();
    return TEAM.set(newId(), { name: norm(name), createdAt: Date.now() });
  }

  // ---------- render ----------
  function render() {
    // keep half-typed text and focus when live updates redraw the page
    const keep = {}; document.querySelectorAll("[data-keep]").forEach((el) => { keep[el.id] = el.value; });
    const ae = document.activeElement, focusId = ae && ae.id && ae !== document.body ? ae.id : null;
    const noBoard = !state.board;
    $("#start").hidden = !noBoard; $("#tabs").hidden = noBoard; $("#invite-btn").hidden = noBoard;
    document.querySelector(".me").hidden = noBoard; $("#conn").hidden = noBoard;
    if (noBoard) { $("#panel-tasks").hidden = true; $("#panel-notes").hidden = true; renderNotices(); renderStart(); return; }
    renderTabs(); renderMe(); renderNotices();
    if (state.tab === "tasks") {
      renderSetup(); renderTeam(); renderComposer(); renderSummary(); renderFilters(); renderList();
    } else {
      renderNotes();
    }
    for (const id in keep) { const el = document.getElementById(id); if (el && el.dataset.keep != null) el.value = keep[id]; }
    if (focusId && document.activeElement !== document.getElementById(focusId)) { const el = document.getElementById(focusId); if (el && el.focus) el.focus({ preventScroll: true }); }
  }

  function renderTabs() {
    const open = [...state.tasks.values()].filter((t) => t.status !== "done").length;
    $("#badge-tasks").textContent = open;
    $("#badge-notes").textContent = state.notes.size;
    $("#tab-tasks").setAttribute("aria-selected", String(state.tab === "tasks"));
    $("#tab-notes").setAttribute("aria-selected", String(state.tab === "notes"));
    $("#panel-tasks").hidden = state.tab !== "tasks";
    $("#panel-notes").hidden = state.tab !== "notes";
  }

  function renderMe() {
    const sel = $("#me-select"); const names = teamNames();
    sel.replaceChildren(h("option", { value: "" }, names.length ? "choose…" : "no team yet"));
    for (const n of names) sel.append(h("option", { value: n, selected: keyOf(n) === keyOf(state.me) }, n));
    sel.disabled = !names.length;
  }

  function setMe(name) { state.me = name; lsSet(LS_ME, name); render(); }

  function renderSetup() {
    const el = $("#setup");
    const hasTeam = state.team.size > 0, hasMe = !!state.me && teamNames().some((n) => keyOf(n) === keyOf(state.me)), hasTask = state.tasks.size > 0;
    el.hidden = false;
    if (!state.loaded || !state.canWrite || (hasTeam && hasMe && hasTask)) { el.replaceChildren(); el.hidden = true; return; }

    if (hasTeam && hasTask && !hasMe) {
      el.replaceChildren(h("div", { class: "card" },
        h("h2", null, "Which one is you?"),
        h("p", { class: "lead" }, "Tap your name so you can claim tasks and see what's yours. This only changes this device."),
        h("div", { class: "whoami" }, teamNames().map((n) => h("button", { type: "button", onclick: () => setMe(n) }, avatar(n), n)))));
      return;
    }

    const nameInput = h("input", { type: "text", id: "setup-name", "data-keep": "", placeholder: "Type a name, press Enter", maxlength: "40", "aria-label": "Teammate name" });
    const addName = () => {
      const n = norm(nameInput.value); if (!n) return;
      nameInput.value = "";
      addMemberIfNew(n).then(() => { const again = $("#setup-name"); if (again) again.focus(); }, quiet);
    };
    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addName(); } });

    el.replaceChildren(h("div", { class: "card" },
      h("h2", null, "Get your team set up"),
      h("p", { class: "lead" }, "Three quick steps. Tap “Invite friends” at the top any time to get the link for your group chat."),
      h("div", { class: "steps" },
        h("div", { class: "step" + (hasTeam ? " ok" : "") },
          h("span", { class: "num" }, hasTeam ? svg(ICON.check) : "1"),
          h("div", null, h("div", { class: "what" }, "Add everyone on your team"),
            h("div", { class: "add-person" }, nameInput, h("button", { class: "btn small", type: "button", onclick: addName }, "Add")),
            hasTeam ? h("div", { class: "team", style: "margin-top:8px" }, [...state.team.values()].map((m) => h("span", { class: "person no-x" }, avatar(m.name), m.name))) : null)),
        h("div", { class: "step" + (hasMe ? " ok" : hasTeam ? "" : " later") },
          h("span", { class: "num" }, hasMe ? svg(ICON.check) : "2"),
          h("div", null, h("div", { class: "what" }, hasMe ? "You're " + state.me : "Tap your own name"),
            hasTeam && !hasMe ? h("div", { class: "whoami" }, teamNames().map((n) => h("button", { type: "button", onclick: () => setMe(n) }, avatar(n), n))) : null)),
        h("div", { class: "step" + (hasTask ? " ok" : hasTeam ? "" : " later") },
          h("span", { class: "num" }, hasTask ? svg(ICON.check) : "3"),
          h("div", null, h("div", { class: "what" }, "Add your first task in the box below"))))));
  }

  function renderTeam() {
    const el = $("#team");
    const members = [...state.team.entries()].sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
    if (!members.length) { el.hidden = true; return; }
    el.hidden = false;
    el.replaceChildren(h("span", { class: "label" }, "Team"));
    for (const [id, m] of members) {
      el.append(h("span", { class: "person" + (state.canWrite ? "" : " no-x") },
        avatar(m.name), m.name,
        state.canWrite ? h("button", { class: "x", type: "button", "aria-label": "Remove " + m.name + " from the team", title: "Remove from team",
          onclick: () => { const data = Object.assign({}, m); TEAM.del(id).then(() => toast(m.name + " removed.", { label: "Undo", run: () => TEAM.set(id, data).catch(quiet) }), quiet); } }, "×") : null));
    }

      const input = h("input", { type: "text", id: "add-person", "data-keep": "", placeholder: "+ add someone", maxlength: "40", "aria-label": "Add teammate" });

        if (e.key !== "Enter") return; e.preventDefault();
        const n = norm(input.value); if (!n) return;

      });
      el.append(h("span", { class: "add-person" }, input));

  }

  // ----- composer -----
  function renderComposer() {
    const slot = $("#composer-slot");
    if (!state.canWrite || !state.loaded) { slot.replaceChildren(); return; }
    const active = document.activeElement && slot.contains(document.activeElement) ? document.activeElement.id : null;
    const parentTask = draft.parent && state.tasks.get(draft.parent);
    if (draft.parent && !parentTask) draft.parent = "";

    const title = h("input", { type: "text", id: "c-title", maxlength: "200", placeholder: parentTask ? "Name the subtask" : "What needs doing? e.g. Grab extension leads from the help desk" });
    title.value = draft.title;
    title.addEventListener("input", () => { draft.title = title.value; if (!draft.open && title.value) { draft.open = true; renderComposer(); } });
    title.addEventListener("focus", () => { if (!draft.open) { draft.open = true; renderComposer(); } });

    const kids = [];
    if (parentTask) kids.push(h("div", { class: "under" }, "Adding under ", h("b", null, parentTask.title),
      h("button", { type: "button", onclick: () => { draft.parent = ""; renderComposer(); } }, "make it top level")));
    kids.push(h("div", { class: "title-row" }, title, h("button", { class: "btn primary", type: "submit" }, "Add task")));

    if (draft.open) {
      // who
      const names = teamNames();
      for (const p of draft.picked) if (!names.some((n) => keyOf(n) === keyOf(p))) names.push(p);
      const newp = h("input", { class: "newp", type: "text", id: "c-newp", placeholder: "+ someone else", maxlength: "40", "aria-label": "Add another person" });
      newp.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return; e.preventDefault();
        const n = norm(newp.value); if (!n) return;
        if (!draft.picked.some((p) => keyOf(p) === keyOf(n))) draft.picked.push(n);
        renderComposer(); const a = $("#c-newp"); if (a) a.focus();
      });
      const who = h("div", null, h("div", { class: "mini-label" }, "Who's doing it"),
        h("div", { class: "pick" },
          names.map((n) => {
            const on = draft.picked.some((p) => keyOf(p) === keyOf(n));

          }), newp));

      // where
      const loc = h("input", { type: "text", id: "c-loc", maxlength: "80", list: "c-places", placeholder: "Where? e.g. Room 2, our table, help desk" });

      loc.addEventListener("input", () => { draft.location = loc.value; });
      const ps = places().slice(0, 6);
      const where = h("div", null, h("div", { class: "mini-label" }, "Where"),
        h("div", { class: "where-row" }, loc,
          ps.map((p) => h("button", { type: "button", class: "place-chip", "aria-pressed": String(keyOf(p) === keyOf(draft.location)),
            onclick: () => { draft.location = keyOf(p) === keyOf(draft.location) ? "" : p; renderComposer(); } }, p))),
        h("datalist", { id: "c-places" }, places().map((p) => h("option", { value: p }))));

      // details
      let details;
      if (draft.showNotes || draft.notes) {
        const ta = h("textarea", { id: "c-notes", maxlength: "1000", placeholder: "Details, links, what done looks like" });
        ta.value = draft.notes; ta.addEventListener("input", () => { draft.notes = ta.value; });
        details = h("div", null, h("div", { class: "mini-label" }, "Details"), ta);
      }
      kids.push(h("div", { class: "more" }, who, where, details || null,
        h("div", { class: "foot" },
          !details ? h("button", { type: "button", class: "linkish", onclick: () => { draft.showNotes = true; renderComposer(); const a = $("#c-notes"); if (a) a.focus(); } }, "+ Add details") : h("span"),
          h("button", { type: "button", class: "btn ghost small", onclick: resetDraft }, "Clear"))));
    }

    const form = h("form", { class: "composer", id: "composer", autocomplete: "off" }, kids);
    form.addEventListener("submit", submitDraft);
    slot.replaceChildren(form);
    if (active) { const a = document.getElementById(active); if (a) { a.focus(); if (a.setSelectionRange && a.value) { try { a.setSelectionRange(a.value.length, a.value.length); } catch (e) {} } } }
  }
  function resetDraft() {
    Object.assign(draft, { title: "", picked: [], location: "", notes: "", parent: "", open: false, showNotes: false });
    renderComposer();
  }
  async function submitDraft(e) {
    e.preventDefault();

  function cleanCfg(o) {

  function codeFrom(text) {
    const t = String(text || "").trim();
    const m = t.match(/[?&]board=([a-z0-9]+)/i); const c = (m ? m[1] : t).toLowerCase();
    return validCode(c) ? c : "";
  }
  function setBoardInUrl(code) {
    try {
      const u = new URL(location.href);
      if (code) u.searchParams.set("board", code); else u.searchParams.delete("board");
      u.searchParams.delete("db");
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    } catch (e) {}
  }

  function renderStart() {
    const el = $("#start");
    if (!isConfigured()) { renderSetupDb(el); return; }
    const join = h("input", { type: "text", id: "join-code", "data-keep": "", placeholder: "Paste the invite link", "aria-label": "Invite link or board code" });
    const err = h("div", { class: "err", role: "alert" });
    const doJoin = () => {
      const c = codeFrom(join.value);
      if (!c) { err.textContent = "That doesn't look like a Task Tree invite link. Ask whoever made the board to send it again."; return; }
      const cfg = cfgFromLink(join.value); if (cfg && !HARDCODED) useConfig(cfg);
      openBoard(c);
    };
    join.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doJoin(); } });
    el.replaceChildren(h("div", { class: "start" },
      h("div", { class: "card" },
        h("h2", null, "Start a board for your team"),
        h("p", { class: "lead", style: "margin:0" }, "You'll get a private invite link to send to your friends. Anyone with the link can add and edit tasks."),
        h("div", null, h("button", { class: "btn primary", type: "button", onclick: () => { openBoard(makeCode()); setTimeout(openInvite, 300); } }, "Create a new board"))),
      h("div", { class: "or" }, "or"),
      h("div", { class: "card" },
        h("h2", null, "Join your friends' board"),
        h("div", { class: "join-row" }, join, h("button", { class: "btn", type: "button", onclick: doJoin }, "Join")),
        err)));
  }

  function renderSetupDb(el) {
    const ta = h("textarea", { id: "cfg-text", "data-keep": "", spellcheck: "false", placeholder: "const firebaseConfig = {\n  apiKey: \"...\",\n  authDomain: \"...\",\n  projectId: \"...\",\n  ...\n};", "aria-label": "Firebase config" });
    const err = h("div", { class: "err", role: "alert" });
    const copyRules = h("button", { class: "btn small", type: "button", onclick: async () => {
      try { await navigator.clipboard.writeText(RULES); copyRules.textContent = "Copied"; }
      catch (e) { const r = document.getElementById("rules-pre"); const sel = getSelection(); const rg = document.createRange(); rg.selectNodeContents(r); sel.removeAllRanges(); sel.addRange(rg); copyRules.textContent = "Selected: press Ctrl+C / ⌘C"; }
    } }, "Copy rules");
    const connect = () => {
      const c = parseCfgText(ta.value);
      if (!c) { err.textContent = "Couldn't find apiKey, projectId and appId in that. Copy the whole firebaseConfig block from step 4 and paste it again."; return; }
      useConfig(c); ta.value = ""; toast("Connected to " + c.projectId + "."); render();
    };
    const join = h("input", { type: "text", id: "join-link-setup", "data-keep": "", placeholder: "Paste the invite link", "aria-label": "Invite link" });
    const jerr = h("div", { class: "err", role: "alert" });
    const doJoin = () => {
      const code = codeFrom(join.value), cfg = cfgFromLink(join.value);
      if (!code || !cfg) { jerr.textContent = "That doesn't look like a full Task Tree invite link. Ask whoever made the board to send it again."; return; }
      useConfig(cfg); openBoard(code);
    };
    join.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doJoin(); } });
    el.replaceChildren(h("div", { class: "start" },
      h("div", { class: "card" },
        h("h2", null, "Got an invite link?"),
        h("p", { class: "lead", style: "margin:0" }, "Just open it, or paste it here."),
        h("div", { class: "join-row" }, join, h("button", { class: "btn", type: "button", onclick: doJoin }, "Join")), jerr),
      h("div", { class: "or" }, "or, if you're the one setting it up"),
      h("div", { class: "card" },
        h("h2", null, "Connect a free database (one time, about 5 min)"),
        h("p", { class: "lead", style: "margin:0" }, "Task Tree saves your board in Firebase, Google's free database, so everyone sees the same tasks. Only you need to do this. Your friends get it through the invite link."),
        h("ol", { class: "setup-steps" },
          h("li", null, "Go to ", h("a", { href: "https://console.firebase.google.com", target: "_blank", rel: "noopener" }, "console.firebase.google.com"), ", sign in and click ", h("b", null, "Create a project"), ". Analytics can be off."),
          h("li", null, "In the left panel open ", h("b", null, "Databases & Storage → Firestore"), " and click ", h("b", null, "Create database"), ". Choose ", h("b", null, "Standard edition"), ", leave the Database ID as ", h("b", null, "(default)"), ", pick ", h("b", null, "europe-west2 (London)"), " and ", h("b", null, "production mode"), "."),
          h("li", null, "Open the ", h("b", null, "Rules"), " tab, replace everything with these rules and click ", h("b", null, "Publish"), ".",
            h("pre", { class: "rules", id: "rules-pre" }, RULES), h("div", { class: "row-btns" }, copyRules)),
          h("li", null, "Click the gear icon → ", h("b", null, "Project settings"), ". Under ", h("b", null, "Your apps"), " click the web icon ", h("b", null, "</>"), ", give it any name (leave Hosting unticked) and click ", h("b", null, "Register app"), ". Copy the ", h("b", null, "firebaseConfig"), " block it shows."),
          h("li", null, "Paste it here:", ta, h("div", { class: "row-btns" }, h("button", { class: "btn primary", type: "button", onclick: connect }, "Connect")), err)))));
  }

  function openInvite() {
    if (!state.board) return;
    const link = inviteLink(state.board);
    const input = h("input", { type: "text", id: "invite-link", readonly: true, value: link, "aria-label": "Invite link" });
    input.addEventListener("focus", () => input.select());
    const copyBtn = h("button", { class: "btn primary", type: "button", onclick: async () => {
      try { await navigator.clipboard.writeText(link); copyBtn.textContent = "Copied"; }
      catch (e) { input.focus(); input.select(); copyBtn.textContent = "Press Ctrl+C / ⌘C"; }
    } }, "Copy link");
    openSheet(h("div", { class: "confirm" },
      h("h2", { id: "sheet-title" }, "Invite your friends"),
      h("p", { style: "margin:0" }, "Send this link in your group chat. Anyone who opens it can see and edit this board, so only share it with your team."),
      h("div", { class: "copy-row" }, input, copyBtn),
      h("div", { class: "sheet-actions", style: "justify-content:space-between" },
        h("button", { class: "btn ghost small", type: "button", onclick: () => { closeSheet(); leaveBoard(); } }, "Switch to another board"),
        h("button", { class: "btn", type: "button", onclick: closeSheet }, "Done"))));
  }
  $("#invite-btn").addEventListener("click", openInvite);

  let unsubs = [];
  function leaveBoard() {
    unsubs.forEach((u) => { try { u(); } catch (e) {} }); unsubs = [];
    state.board = ""; state.db = null; state.loaded = false;
    state.tasks = new Map(); state.team = new Map(); state.notes = new Map();
    lsSet(LS_BOARD, ""); setBoardInUrl(""); connNotice = null; render();
  }

  let fbPromise = null;
  function loadFirebase() {
    if (!fbPromise) {
      const base = "https://www.gstatic.com/firebasejs/" + FIREBASE_VERSION + "/";
      fbPromise = Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js")]).then(([appMod, fsMod]) => {
        const app = appMod.initializeApp(fbConfig);
        return { fs: fsMod, db: fsMod.getFirestore(app) };
      });
      fbPromise.catch(() => { fbPromise = null; });
    }
    return fbPromise;
  }

  async function openBoard(code) {
    unsubs.forEach((u) => { try { u(); } catch (e) {} }); unsubs = [];
    state.board = code; lsSet(LS_BOARD, code); setBoardInUrl(code);
    state.loaded = false; state.tasks = new Map(); state.team = new Map(); state.notes = new Map();
    setConn("", "connecting…"); render();
    let fb;
    try { fb = await loadFirebase(); }
    catch (e) {
      state.loaded = true;
      setConn("error", "offline", "Couldn't load the database. Check your internet connection, then reload the page.");
      render(); return;
    }
    if (state.board !== code) return;
    const { fs, db } = fb;
    const ref = (name, id) => fs.doc(db, "boards", code, name, id);
    state.db = {
      set: (name, id, data) => fs.setDoc(ref(name, id), data),
      update: (name, id, patch) => fs.updateDoc(ref(name, id), patch),
      del: (name, id) => fs.deleteDoc(ref(name, id))
    };
    const ok = { tasks: false, team: false, notes: false }; let failed = false;
    const timer = setTimeout(() => { if (!failed) setConn("warn", "slow", state.loaded ? "Can't reach the board right now. What you see may be out of date." : "Can't reach the board yet. Check your connection."); }, 10000);
    const settle = () => { if (ok.tasks && ok.team && ok.notes && !failed) { clearTimeout(timer); setConn("live", "live"); } };
    const fail = (e) => {
      if (failed) return; failed = true; clearTimeout(timer); state.loaded = true;
      const denied = e && String(e.code).endsWith("permission-denied");
      setConn("error", "offline", denied
        ? "The database refused to open this board. Check the Firestore rules were published (setup step 3)."
        : "Lost the connection to the board. Reload the page to reconnect.");
      render();
    };
    for (const name of ["tasks", "team", "notes"]) {
      unsubs.push(fs.onSnapshot(fs.collection(db, "boards", code, name), { includeMetadataChanges: true }, (snap) => {
        state[name] = new Map(snap.docs.map((d) => [d.id, d.data()]));
        if (name === "tasks") state.loaded = true;
        if (!snap.metadata.fromCache) { ok[name] = true; settle(); }
        render();
      }, fail));
    }
  }

  // pick the board: invite link first, then the last board used on this device
  (function boot() {
    let code = "";
    try { code = codeFrom(new URL(location.href).searchParams.get("board") || ""); } catch (e) {}
    if (!code) code = codeFrom(lsGet(LS_BOARD) || "");
    if (code && isConfigured()) openBoard(code); else render();
  })();
})();
</script>
</body>
</html>
